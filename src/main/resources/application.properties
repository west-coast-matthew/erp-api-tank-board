spring.application.name=erp-api-tank-board
server.port=5184

spring.jpa.show-sql=true
# Off by default, as in erp-api-entity-mgmnt-java. Set DDL_AUTO=update in .env for a first run
# so Hibernate creates the tank_board tables (it also checks the erp-core-java tables).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}

# Values below come from .env (see .env.example) via springboot3-dotenv.
spring.datasource.driverClassName=${DB_DRIVER_CLASS_NAME}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# When true, every facility with no shared tank boards gets the demo templates on startup.
tank-board.seed-demo-templates=${SEED_DEMO_TEMPLATES:true}
